<!DOCTYPE html>
<html>
  <head>
    <title>Reconnaissance de Couleur</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f7f7f7;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }
      h1 {
        color: #333;
        margin-bottom: 20px;
      }
      #toggleButton {
        background-color: #4caf50;
        color: white;
        border: none;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s;
      }
      #toggleButton:hover {
        background-color: #45a049;
      }
      #status {
        font-size: 18px;
        margin-top: 15px;
        color: #555;
      }
      #colorOutput {
        font-size: 20px;
        font-weight: bold;
        margin-top: 20px;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>Reconnaissance de Couleur</h1>
      <button id="toggleButton">Marche</button>
      <p id="status">Statut : Arrêté</p>
      <p id="colorOutput">Couleur reconnue : Aucune</p>
    </div>

    <script>
      const socket = io();
      let isRunning = false;

      document.getElementById('toggleButton').addEventListener('click', () => {
        socket.emit('toggle_button');
      });

      socket.on('update_status', (data) => {
        isRunning = data.is_running;
        document.getElementById('status').textContent =
          'Statut : ' + (isRunning ? 'En Marche' : 'Arrêté');
        document.getElementById('toggleButton').textContent = isRunning
          ? 'Arrêt'
          : 'Marche';
      });

      socket.on('recognized_color', (data) => {
        const colorOutput = document.getElementById('colorOutput');
        colorOutput.textContent = 'Couleur reconnue : ' + data.color;
        switch (data.color) {
          case 'bleu':
            colorOutput.style.color = 'blue';
            break;
          case 'rouge':
            colorOutput.style.color = 'red';
            break;
          case 'vert':
            colorOutput.style.color = 'green';
            break;
          case 'jaune':
            colorOutput.style.color = 'gold';
            break;
          default:
            colorOutput.style.color = '#555';
        }
      });
    </script>
  </body>
</html>
